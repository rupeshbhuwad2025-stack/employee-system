
server.port=8761
eureka.client.serviceUrl.defaultZone  = http://localhost:8861/eureka
eureka.client.instance.preferIpAddress = false
spring.application.name = employee-service


spring.security.user.name=rupesh
spring.security.user.password=rupesh
spring.security.user.roles=manager


spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update


# Kafka Broker Address (default for local setup)
spring.kafka.bootstrap-servers=host.docker.internal:9092

logging.file.name=logs/app.log

# Consumer Configuration
spring.kafka.consumer.group-id=my-new-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


